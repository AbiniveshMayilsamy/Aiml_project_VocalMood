<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Result</title>
    <!-- Google Fonts for Aesthetic Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons (if needed) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css for Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f3e7ff 0%, #d9c2f2 50%, #c7a5e6 100%);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Styling */
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 12px 30px rgba(106, 27, 154, 0.2);
            animation: fadeIn 1s ease-in-out;
            text-align: center;
        }

        .accent {
            color: #6A1B9A;
            text-shadow: 1px 1px 3px rgba(106, 27, 154, 0.3);
        }

        /* Result Card */
        .result-card {
            border: 2px solid #6A1B9A;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            background-color: #f9f9f9;
            box-shadow: inset 0 0 15px #d1b3ff;
        }

        /* Emotion Display */
        .emotion-display {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .emotion-display .emoji {
            font-size: 2.5em;
        }

        /* Circular Chart */
        .circle-chart {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            position: relative;
        }

        .circle-chart svg {
            position: absolute;
            top: 0;
            left: 0;
        }

        .circle {
            fill: none;
            stroke-width: 20;
            stroke-linecap: round;
            transform: translate(100px, 100px) rotate(-90deg);
            transition: stroke-dashoffset 0.35s;
        }

        .circle-bg {
            stroke: #eee;
        }

        .circle-progress {
            stroke: #6A1B9A;
        }

        .chart-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            font-weight: bold;
            color: #6A1B9A;
        }

        /* Navigation Links */
        a {
            color: #6A1B9A;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #9C27B0;
        }

        /* Fade-in Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="accent">Analysis Complete!</h2>
        
        <div class="result-card">
            <div class="emotion-display accent">
                Detected Emotion: <span class="emoji" id="emotionEmoji"></span> {{ emotion }}
            </div>
            
            <div class="circle-chart">
                <svg width="200" height="200">
                    <circle class="circle-bg circle" cx="100" cy="100" r="90"></circle>
                    <circle class="circle-progress circle" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="565.48"></circle>
                </svg>
                <div class="chart-text" id="confidenceText">{{ "%.1f"|format(confidence) }}%</div>
            </div>
        </div>
        
        <p>
            <a href="/analyze">← Analyze Another File</a> | 
            <a href="/history">View All Results</a> | 
            <a href="/">Home</a>
        </p>
    </div>

    <script>
        // Emotion to Emoji Mapping
        const emotionEmojis = {
            'angry': '😠',
            'sad': '😢',
            'neutral': '😐',
            'happy': '😊'
        };

        const emotion = '{{ emotion|lower }}';
        document.getElementById('emotionEmoji').textContent = emotionEmojis[emotion] || '❓';

        // Circular Chart Animation
        const progressCircle = document.querySelector('.circle-progress');
        const circumference = 2 * Math.PI * 90;  // r=90
        progressCircle.style.strokeDasharray = circumference;

        const confidence = parseFloat('{{ confidence }}');
        const offset = circumference - (circumference * (confidence / 100));
        progressCircle.style.strokeDashoffset = offset;
    </script>
</body>
</html>
